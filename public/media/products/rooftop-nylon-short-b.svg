<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  
  <defs>
    <filter id="grain-rooftopnylon-b" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.12"/></feComponentTransfer>
    </filter>
    <filter id="soft-rooftopnylon-b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="blur-rooftopnylon-b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <pattern id="dots-rooftopnylon-b" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="3.2" fill="#000000"/>
    </pattern>
    <pattern id="lines-rooftopnylon-b" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="4" height="10" fill="#000000"/>
    </pattern>
    <linearGradient id="shade-rooftopnylon-b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.32"/>
    </linearGradient>
    <radialGradient id="fade-rooftopnylon-b" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="halo-rooftopnylon-b"><rect width="100%" height="100%" fill="url(#fade-rooftopnylon-b)"/></mask>
  </defs>
  <rect width="800" height="1000" fill="#8FA6B2"/>
  <rect width="800" height="1000" fill="url(#fade-rooftopnylon-b)" opacity="0.35"/>
  
  <ellipse cx="400" cy="900" rx="260" ry="34" fill="#000" opacity="0.22" filter="url(#soft-rooftopnylon-b)"/>
  <g transform="translate(400 470) scale(1.9) translate(-400 -420)">
    <path d="M272 300 L528 300 L568 640 L432 656 L404 470 L396 470 L368 656 L232 640 Z" fill="#080808"/>
    <path d="M272 300 L528 300 L568 640 L432 656 L404 470 L396 470 L368 656 L232 640 Z" fill="url(#shade-rooftopnylon-b)"/>
    <rect x="270" y="300" width="260" height="36" fill="#000" fill-opacity="0.28"/>
    <path d="M250 600 L560 600" stroke="#FF7900" stroke-width="0"/>
    <path d="M236 610 L370 624 M564 610 L430 624" stroke="#FF7900" stroke-width="8"/>
    <line x1="388" y1="336" x2="378" y2="420" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <line x1="412" y1="336" x2="422" y2="420" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <g transform="translate(500 560) scale(1)"><rect x="-22" y="-12" width="44" height="24" rx="3" fill="#FF7900"/><text x="0" y="6" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" font-weight="700" fill="#080808" text-anchor="middle">AFB</text></g></g>
  <rect width="800" height="1000" filter="url(#grain-rooftopnylon-b)" style="mix-blend-mode:overlay"/>
  <text x="36" y="52" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="15" letter-spacing="2" fill="#080808" text-anchor="start">AFROBIAN/HUB</text>
  <text x="764" y="52" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="15" letter-spacing="2" fill="#080808" text-anchor="end">DETAIL</text>
  <text x="36" y="964" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" letter-spacing="2" fill="#080808" text-anchor="start">ROOFTOP NYLON SHORT</text>
  <text x="764" y="964" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" letter-spacing="2" fill="#080808" text-anchor="end">TEMP SHOT</text>
</svg>
