<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  
  <defs>
    <filter id="grain-nightmarketb-a" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.12"/></feComponentTransfer>
    </filter>
    <filter id="soft-nightmarketb-a" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="blur-nightmarketb-a" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <pattern id="dots-nightmarketb-a" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="3.2" fill="#ffffff"/>
    </pattern>
    <pattern id="lines-nightmarketb-a" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="4" height="10" fill="#ffffff"/>
    </pattern>
    <linearGradient id="shade-nightmarketb-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.32"/>
    </linearGradient>
    <radialGradient id="fade-nightmarketb-a" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="halo-nightmarketb-a"><rect width="100%" height="100%" fill="url(#fade-nightmarketb-a)"/></mask>
  </defs>
  <rect width="800" height="1000" fill="#080808"/>
  <rect width="800" height="1000" fill="url(#fade-nightmarketb-a)" opacity="0.08"/>
  
  <ellipse cx="400" cy="900" rx="260" ry="34" fill="#000" opacity="0.6" filter="url(#soft-nightmarketb-a)"/>
  <g transform="">
    <path d="M285 250 L350 222 Q400 255 450 222 L515 250 L585 320 L540 362 L515 342 Q505 470 520 640 Q400 662 280 640 Q295 470 285 342 L260 362 L215 320 Z" fill="#F2EEE7"/>
    <path d="M350 222 Q400 255 450 222 Q442 240 400 248 Q358 240 350 222 Z" fill="#000" fill-opacity="0.35"/>
    <path d="M285 250 L350 222 Q400 255 450 222 L515 250 L585 320 L540 362 L515 342 Q505 470 520 640 Q400 662 280 640 Q295 470 285 342 L260 362 L215 320 Z" fill="url(#shade-nightmarketb-a)"/>
    <g transform="translate(400 380) scale(0.75)"><path d="M0 -60 L14 -14 L60 0 L14 14 L0 60 L-14 14 L-60 0 L-14 -14 Z" fill="#FF7900"/></g></g>
  <rect width="800" height="1000" filter="url(#grain-nightmarketb-a)" style="mix-blend-mode:overlay"/>
  <text x="36" y="52" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="15" letter-spacing="2" fill="#F2EEE7" text-anchor="start">AFROBIAN/HUB</text>
  <text x="764" y="52" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="15" letter-spacing="2" fill="#F2EEE7" text-anchor="end">FRONT</text>
  <text x="36" y="964" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" letter-spacing="2" fill="#F2EEE7" text-anchor="start">NIGHT MARKET BABY TEE</text>
  <text x="764" y="964" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" letter-spacing="2" fill="#F2EEE7" text-anchor="end">TEMP SHOT</text>
</svg>
