  <rect x="0" y="0" width="800" height="1000" fill="url(#lines-northboundco-c)" opacity="0.05"/>
  <ellipse cx="400" cy="900" rx="260" ry="34" fill="#000" opacity="0.6" filter="url(#soft-northboundco-c)"/>
  <g transform="translate(400 500) rotate(-8) scale(0.9) translate(-400 -500)">
    <path d="M330 222 L400 262 L470 222 L560 258 Q612 292 626 372 L662 690 L600 706 L560 430 L556 770 Q400 788 244 770 L240 430 L200 706 L138 690 L174 372 Q188 292 240 258 Z" fill="#080808"/>
