  <rect x="0" y="0" width="800" height="1000" fill="url(#lines-orbitpufferv-c)" opacity="0.05"/>
  <ellipse cx="400" cy="900" rx="260" ry="34" fill="#000" opacity="0.6" filter="url(#soft-orbitpufferv-c)"/>
  <g transform="translate(400 500) rotate(-8) scale(0.9) translate(-400 -500)">
