<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  
  <defs>
    <filter id="grain-couriertote-c" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.12"/></feComponentTransfer>
    </filter>
    <filter id="soft-couriertote-c" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="blur-couriertote-c" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <pattern id="dots-couriertote-c" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="3.2" fill="#ffffff"/>
    </pattern>
    <pattern id="lines-couriertote-c" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="4" height="10" fill="#ffffff"/>
    </pattern>
    <linearGradient id="shade-couriertote-c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.32"/>
    </linearGradient>
    <radialGradient id="fade-couriertote-c" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="halo-couriertote-c"><rect width="100%" height="100%" fill="url(#fade-couriertote-c)"/></mask>
  </defs>
  <rect width="800" height="1000" fill="#080808"/>
  <rect width="800" height="1000" fill="url(#fade-couriertote-c)" opacity="0.08"/>
  <rect x="0" y="0" width="800" height="1000" fill="url(#lines-couriertote-c)" opacity="0.05"/>
  <ellipse cx="400" cy="900" rx="260" ry="34" fill="#000" opacity="0.6" filter="url(#soft-couriertote-c)"/>
  <g transform="translate(400 500) rotate(-8) scale(0.9) translate(-400 -500)">
    <path d="M330 380 Q330 210 400 210 Q470 210 470 380" stroke="#F2EEE7" stroke-width="22" fill="none"/>
    <path d="M330 380 Q330 210 400 210 Q470 210 470 380" stroke="#000" stroke-opacity="0.25" stroke-width="22" fill="none"/>
    <rect x="235" y="360" width="330" height="420" fill="#F2EEE7"/>
    <rect x="235" y="360" width="330" height="420" fill="url(#shade-couriertote-c)"/>
    <text x="400" y="560" font-family="Impact, 'Anton', 'Arial Narrow Bold', 'Arial Black', sans-serif" font-size="88" fill="#080808" text-anchor="middle">AFRO</text>
    <text x="400" y="645" font-family="Impact, 'Anton', 'Arial Narrow Bold', 'Arial Black', sans-serif" font-size="88" fill="#080808" text-anchor="middle">BIAN</text>
    <text x="400" y="700" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="15" letter-spacing="2" fill="#080808" text-anchor="middle">CARRY THE CULTURE</text></g>
  <rect width="800" height="1000" filter="url(#grain-couriertote-c)" style="mix-blend-mode:overlay"/>
  <text x="36" y="52" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="15" letter-spacing="2" fill="#F2EEE7" text-anchor="start">AFROBIAN/HUB</text>
  <text x="764" y="52" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="15" letter-spacing="2" fill="#F2EEE7" text-anchor="end">ALT VIEW</text>
  <text x="36" y="964" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" letter-spacing="2" fill="#F2EEE7" text-anchor="start">COURIER TOTE</text>
  <text x="764" y="964" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" letter-spacing="2" fill="#F2EEE7" text-anchor="end">TEMP SHOT</text>
</svg>
